name: job_radar
version: "1.0.0"
profile: job_radar
config-version: 2

vars:
  # Your experience for the Today list and labeling queue. US experience counts most: about
  # 1 to 2 years in the US plus 2.5 in India, so 3 is used. Jobs asking up to 3 years are
  # "Within reach", up to 3 + 2 = 5 are "Stretch", 6 or more are hidden.
  my_years_experience: 3
  stretch_years: 2

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  job_radar:
    staging:
      +schema: staging        # -> jobradar_dev_staging / jobradar_ci_staging / jobradar_staging
      +materialized: view
    marts:
      +schema: gold           # -> jobradar_dev_gold / jobradar_ci_gold / jobradar_gold
      +materialized: table

seeds:
  job_radar:
    +schema: staging
