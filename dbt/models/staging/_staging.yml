version: 2

models:
  - name: stg_postings
    description: One row per posting, with is_us, role_family, seniority and intern rules applied.
    columns:
      - name: posting_key
        description: source:posting_id, unique across boards.
        data_tests: [unique, not_null]
      - name: role_family
        data_tests:
          - accepted_values:
              arguments:
                values: ['Business systems / ERP', 'Integration / solutions', 'Data / BI / AI',
                         'Software', 'Technical program / product', 'Other']
      - name: seniority
        data_tests:
          - accepted_values:
              arguments:
                values: ['Intern', 'Director+', 'Staff / principal', 'Senior', 'Mid or not stated']
  - name: stg_lca_filings
    columns:
      - name: case_number
        data_tests: [unique, not_null]
  - name: stg_employer_matches
    description: One row per (company, DOL filer name). A filer name belongs to one company only.
    columns:
      - name: match_method
        data_tests:
          - accepted_values:
              arguments:
                values: [exact, alias]
      - name: company
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('companies')
                field: slug

unit_tests:
  - name: posting_rules_us_role_family_intern
    description: >
      The posting rules on hand-made rows: US only, role families (plain Program Manager and
      Business Analyst stay in Other: not visa-safe targets), interns and Staff+ not target level, visa blockers and green-card style ads (CR11).
    model: stg_postings
    given:
      - input: source('silver', 'postings')
        rows:
          - { source: ashby, posting_id: a1, title: Senior Data Engineer, location: "San Francisco, CA", employment_type: FullTime }
          - { source: ashby, posting_id: a2, title: Software Engineer Intern, location: "New York, NY", employment_type: Intern }
          - { source: greenhouse, posting_id: g1, title: NetSuite Business Systems Analyst, location: "London, UK", employment_type: null }
          - { source: greenhouse, posting_id: g2, title: Staff Solutions Engineer, location: "Remote - US", employment_type: Contract }
          - { source: greenhouse, posting_id: g3, title: Account Executive, location: "Vancouver, BC", employment_type: null }
          - { source: greenhouse, posting_id: g4, title: Senior Consultant, location: "Chicago, IL", employment_type: null }
          - { source: greenhouse, posting_id: g5, title: Technical Program Manager, location: "Seattle, WA", employment_type: null }
          - { source: greenhouse, posting_id: g6, title: Program Manager, location: "Austin, TX", employment_type: null }
          - { source: greenhouse, posting_id: g7, title: Business Analyst, location: "Denver, CO", employment_type: null }
          - { source: greenhouse, posting_id: g8, title: "Director, Analytics Engineering", location: "Boston, MA", employment_type: null }
          - { source: greenhouse, posting_id: g9, title: Senior Data Platform Engineer, location: "Remote - US", employment_type: null, description_text: "Great team. We are unable to sponsor visas for this position at this time." }
          - { source: ashby, posting_id: a3, title: "Deployment Lead, FDE", location: "New York, NY", employment_type: null, description_text: "Full time, 40 hours/week. Experience must include 2 years in each of the following: SQL, Python." }
          - { source: greenhouse, posting_id: m1, title: "Manager, Engineering", location: "Bengaluru, IN", employment_type: null }
          - { source: greenhouse, posting_id: m2, title: "Data Science Manager - Fraud", location: "Indianapolis, IN", employment_type: null }
          - { source: greenhouse, posting_id: m3, title: "Technical Program Manager, AI Delivery", location: "United States", employment_type: null }
          - { source: ashby, posting_id: a4, title: Data Engineer, location: "Seattle, WA", employment_type: null, description_text: "We sponsor visas and support relocation. Depending on the position offered, equity may apply. Full-time, 40 hours per week." }
    expect:
      rows:
        - { posting_key: "ashby:a1", is_us: true, role_family: Data / BI / AI, seniority: Senior, is_intern: false, is_fte_or_contract: true, is_target_level: true, has_visa_blocker: false, is_perm_style_ad: false }
        - { posting_key: "ashby:a2", is_us: true, role_family: Software, seniority: Intern, is_intern: true, is_fte_or_contract: false, is_target_level: false, has_visa_blocker: false, is_perm_style_ad: false }
        - { posting_key: "greenhouse:g1", is_us: false, role_family: Business systems / ERP, seniority: Mid or not stated, is_intern: false, is_fte_or_contract: true, is_target_level: true, has_visa_blocker: false, is_perm_style_ad: false }
        - { posting_key: "greenhouse:g2", is_us: true, role_family: Integration / solutions, seniority: Staff / principal, is_intern: false, is_fte_or_contract: true, is_target_level: false, has_visa_blocker: false, is_perm_style_ad: false }
        - { posting_key: "greenhouse:g3", is_us: false, role_family: Other, seniority: Mid or not stated, is_intern: false, is_fte_or_contract: true, is_target_level: true, has_visa_blocker: false, is_perm_style_ad: false }
        - { posting_key: "greenhouse:g4", is_us: true, role_family: Integration / solutions, seniority: Senior, is_intern: false, is_fte_or_contract: true, is_target_level: true, has_visa_blocker: false, is_perm_style_ad: false }
        - { posting_key: "greenhouse:g5", is_us: true, role_family: Technical program / product, seniority: Mid or not stated, is_intern: false, is_fte_or_contract: true, is_target_level: true, has_visa_blocker: false, is_perm_style_ad: false }
        - { posting_key: "greenhouse:g6", is_us: true, role_family: Other, seniority: Mid or not stated, is_intern: false, is_fte_or_contract: true, is_target_level: true, has_visa_blocker: false, is_perm_style_ad: false }
        - { posting_key: "greenhouse:g7", is_us: true, role_family: Other, seniority: Mid or not stated, is_intern: false, is_fte_or_contract: true, is_target_level: true, has_visa_blocker: false, is_perm_style_ad: false }
        - { posting_key: "greenhouse:g8", is_us: true, role_family: Data / BI / AI, seniority: Director+, is_intern: false, is_fte_or_contract: true, is_target_level: false, has_visa_blocker: false, is_perm_style_ad: false }
