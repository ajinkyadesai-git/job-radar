version: 2

models:
  - name: dim_employer
    description: One row per tracked company with open jobs and H-1B/E-3 sponsorship history.
    columns:
      - name: company
        data_tests: [unique, not_null]
      - name: company_name
        data_tests: [not_null]
      - name: board_source
        data_tests:
          - accepted_values:
              arguments:
                values: [greenhouse, ashby]
      - name: is_sponsor
        data_tests: [not_null]
      - name: is_h1b_dependent_employer
        description: Half or more of its LCA filings are flagged H-1B dependent (often staffing firms).
        data_tests: [not_null]
      - name: certified_rate
        description: Share of the company's LCA filings that DOL certified (0 to 1).

  - name: fct_postings
    description: Every posting seen, open or closed, with business rules and sponsor stats.
    columns:
      - name: posting_key
        data_tests: [unique, not_null]
      - name: company
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_employer')
                field: company
      - name: title
        data_tests: [not_null]
      - name: first_seen
        data_tests: [not_null]
      - name: is_open
        data_tests: [not_null]
      - name: is_us
        data_tests: [not_null]
      - name: has_visa_blocker
        description: Posting text says it won't sponsor, needs U.S. citizenship or a clearance.
        data_tests: [not_null]
      - name: is_perm_style_ad
        description: Reads like a green-card (PERM) labor-certification ad.
        data_tests: [not_null]

  - name: fct_lca
    description: DOL LCA filings; company is set when the filer is a tracked company.
    columns:
      - name: case_number
        data_tests: [unique, not_null]
      - name: company
        description: Null when the filer is not one of our companies.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_employer')
                field: company
      - name: match_method
        data_tests:
          - accepted_values:
              arguments:
                values: [exact, alias]
      - name: case_status
        data_tests:
          - accepted_values:
              arguments:
                values: [Certified, Certified - Withdrawn, Denied, Withdrawn]
              config:
                severity: warn

  - name: mart_new_postings
    description: >
      The Today list: open US full-time or contract roles at your level, at sponsoring
      companies, first seen in the last 7 days.
    columns:
      - name: posting_key
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_postings')
                field: posting_key
      - name: role_family
        data_tests: [not_null]

  - name: audit_dropped_postings
    description: Open US postings dropped by a visa rule, with the phrase that matched.
    columns:
      - name: matched_text
        data_tests: [not_null]

  - name: mart_sponsor_stats
    description: Filings, approval rate and filed pay by company and occupation (SOC code).
    columns:
      - name: company
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_employer')
                field: company
      - name: filings
        data_tests: [not_null]
