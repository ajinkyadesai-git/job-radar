name: daily

# The daily pipeline: land today's job boards in S3 (prod), run the Databricks job
# (bronze -> silver postings, DOL filings, employer matches), then build and test the gold
# layer with dbt and check the data is fresh. Any failure turns the run red and emails you.
on:
  schedule:
    - cron: "17 14 * * *" # 14:17 UTC = 6:17 PST / 7:17 PDT, off the top of the hour
  workflow_dispatch:
    inputs:
      only:
        description: "Company slugs, space separated (blank = all enabled)"
        required: false

permissions:
  id-token: write # OIDC sign-in to AWS; no AWS keys are stored in GitHub
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      JOBRADAR_ENV: prod
      JOBRADAR_DEST: s3
      JOBRADAR_S3_BUCKET: ${{ vars.JOBRADAR_S3_BUCKET }}
      JOBRADAR_S3_PREFIX: prod
      JOBRADAR_AWS_REGION: ${{ vars.JOBRADAR_AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.JOBRADAR_AWS_REGION }}
      DATABRICKS_SERVER_HOSTNAME: ${{ vars.DATABRICKS_SERVER_HOSTNAME }}
      DATABRICKS_HTTP_PATH: ${{ vars.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Sign in to AWS with OIDC (role allows only main of this repo)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DAILY_ROLE_ARN }}
          aws-region: ${{ vars.JOBRADAR_AWS_REGION }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dbt]"
      - name: Ingest job boards to S3
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            jobradar ingest --only ${{ inputs.only }}
          else
            jobradar ingest
          fi
      - name: Build the lakehouse in Databricks
        run: jobradar databricks-run --job job-radar-daily --param env=prod --timeout 3600
      - name: Build and test the gold layer (dbt, prod)
        working-directory: dbt
        run: dbt build --target prod --profiles-dir .
      - name: Check the data is fresh
        working-directory: dbt
        run: dbt source freshness --target prod --profiles-dir .
