[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-radar"
version = "0.1.0"
description = "Open-source pipeline and AI agent that finds new job postings, matches them to you, and shows how employers hire and pay."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "PyYAML>=6.0,<7",
    "boto3>=1.34,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "moto[s3]>=5,<6",
    "responses>=0.25,<1",
    "ruff>=0.6",
    "job-radar[dol]",
    "scikit-learn>=1.5,<2",
    "sqlglot>=25",
    "faiss-cpu>=1.8,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
]
# What the API server needs, and nothing more (the image stays small; the embedding model
# and FAISS are only needed where a search index exists, which is the laptop).
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "anthropic>=0.70,<3",
    "sqlglot>=25",
    "databricks-sql-connector>=3.3,<5",
]
dol = [
    "pandas>=2.2,<3",
    "python-calamine>=0.2",
    "pyarrow>=15",
]
databricks = [
    "databricks-sql-connector>=3.3,<5",
]
ml = [
    "scikit-learn>=1.5,<2",
    "pandas>=2.2,<3",
    "joblib>=1.4",
    "databricks-sql-connector>=3.3,<5",
]
agent = [
    "anthropic[bedrock]>=0.70,<3",
    "sqlglot>=25",
    "databricks-sql-connector>=3.3,<5",
    "fastembed>=0.5,<1",
    "faiss-cpu>=1.8,<2",
    "pyarrow>=15",
]
dbt = [
    "dbt-databricks>=1.10,<2",
]

[project.scripts]
jobradar = "jobradar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks: spark and dbutils are provided by the runtime; imports follow a sys.path cell.
"spark/*.py" = ["F821", "E402"]
