# Companies whose public job boards Job Radar pulls daily.
#
#   slug         our stable id (used in S3 paths) - never change it once data has landed
#   source       greenhouse | ashby
#   board_token  the company's token on that vendor:
#                  greenhouse -> boards.greenhouse.io/<token>
#                  ashby      -> jobs.ashbyhq.com/<token>
#   tier         A = check often (Kafka alerts, weeks 7-8), B = daily batch only
#
# Tokens below are candidates. Run `make verify` before the first ingest; set
# `enabled: false` (or fix the token) for any board that returns 404 or 0 jobs.
# Companies move between vendors, so a 404 later usually means they switched.

companies:
  # --- Ashby -----------------------------------------------------------------
  - { slug: crusoe,      name: Crusoe,      source: ashby,      board_token: crusoe,      tier: A }
