  - { slug: coinbase,    name: Coinbase,    source: greenhouse, board_token: coinbase }
  - { slug: instacart,   name: Instacart,   source: greenhouse, board_token: instacart }
  - { slug: lyft,        name: Lyft,        source: greenhouse, board_token: lyft }
  - { slug: pinterest,   name: Pinterest,   source: greenhouse, board_token: pinterest }
  - { slug: reddit,      name: Reddit,      source: greenhouse, board_token: reddit }
